<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512"
     viewBox="0 0 256 256" role="img" aria-labelledby="t d">
  <title id="t">JulAIn Music Player — JMP</title>
  <desc id="d">A cheerful robot whose head is a vinyl record: a glowing cyan
    eye, a wide smile cut into the grooves, oversized violet headphones with a
    note on the antenna, fanning out a small stack of playlist cards.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="256" y2="256"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#171a21"/>
      <stop offset="1" stop-color="#0a0b0e"/>
    </linearGradient>
    <linearGradient id="disc" x1="60" y1="50" x2="196" y2="186"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#33404f"/>
      <stop offset=".55" stop-color="#1d2631"/>
      <stop offset="1" stop-color="#121821"/>
    </linearGradient>
    <radialGradient id="lens" cx=".34" cy=".28" r=".85">
      <stop offset="0" stop-color="#e6feff"/>
      <stop offset=".4" stop-color="#67e8f9"/>
      <stop offset=".85" stop-color="#0ea5e9"/>
      <stop offset="1" stop-color="#0369a1"/>
    </radialGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c4b5fd"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="6" y="6" width="244" height="244" rx="46"
        fill="url(#bg)" stroke="#232733" stroke-width="2"/>

  <!-- antenna, with a beamed pair of notes floating beside it -->
  <path d="M128 58 V40" stroke="#a78bfa" stroke-width="4" stroke-linecap="round"/>
  <circle cx="128" cy="37" r="4" fill="#c4b5fd"/>
  <g stroke="url(#violet)" fill="none" stroke-linecap="round"
     stroke-linejoin="round">
    <path d="M146 34 V14" stroke-width="3.4"/>
    <path d="M168 30 V10" stroke-width="3.4"/>
    <path d="M146 14 L168 10 L168 17 L146 21 Z" stroke-width="2" fill="url(#violet)"/>
  </g>
  <ellipse cx="142" cy="36" rx="7" ry="5.2" fill="url(#violet)"
           transform="rotate(-20 142 36)"/>
  <ellipse cx="164" cy="32" rx="7" ry="5.2" fill="url(#violet)"
           transform="rotate(-20 164 32)"/>

  <!-- headphone band, arms and cups -->
  <path d="M54 112 A74 74 0 0 1 202 112" fill="none" stroke="url(#violet)"
        stroke-width="11" stroke-linecap="round"/>
  <path d="M54 112 v14" stroke="url(#violet)" stroke-width="8"
        stroke-linecap="round"/>
  <path d="M202 112 v14" stroke="url(#violet)" stroke-width="8"
        stroke-linecap="round"/>
  <rect x="38" y="118" width="22" height="52" rx="11" fill="url(#violet)"
        stroke="#0f1014" stroke-width="2"/>
  <rect x="196" y="118" width="22" height="52" rx="11" fill="url(#violet)"
        stroke="#0f1014" stroke-width="2"/>

  <!-- the vinyl face -->
  <circle cx="128" cy="118" r="62" fill="url(#disc)" stroke="#46536a"
          stroke-width="2"/>
  <g fill="none" stroke="#9fb2cc" stroke-opacity=".16" stroke-width="1.3">
    <circle cx="128" cy="118" r="54"/>
    <circle cx="128" cy="118" r="46"/>
    <circle cx="128" cy="118" r="38"/>
    <circle cx="128" cy="118" r="30"/>
  </g>
  <path d="M84 92 a52 52 0 0 1 46 -26" fill="none" stroke="#cfe3ff"
        stroke-opacity=".22" stroke-width="4" stroke-linecap="round"/>

  <!-- the face: one AI lens and a grin -->
  <circle cx="128" cy="106" r="17" fill="url(#lens)" filter="url(#glow)"/>
  <circle cx="121" cy="99" r="5.4" fill="#ffffff" opacity=".95"/>
  <circle cx="135" cy="113" r="2.6" fill="#082f49" opacity=".45"/>
  <path d="M100 128 Q128 152 156 128" fill="none" stroke="#67e8f9"
        stroke-width="5.5" stroke-linecap="round"/>
  <path d="M98 126 q-5 3 -4 8" fill="none" stroke="#67e8f9" stroke-width="4"
        stroke-linecap="round" opacity=".65"/>
  <path d="M158 126 q5 3 4 8" fill="none" stroke="#67e8f9" stroke-width="4"
        stroke-linecap="round" opacity=".65"/>

  <!-- a fanned hand of playlist cards -->
  <g stroke="#2b3140" stroke-width="2">
    <rect x="172" y="152" width="32" height="46" rx="6" fill="#1b2130"
          transform="rotate(18 188 175)"/>
    <rect x="164" y="147" width="32" height="46" rx="6" fill="#202839"
          transform="rotate(8 180 170)"/>
    <rect x="154" y="143" width="34" height="48" rx="6" fill="#263042"/>
  </g>
  <g stroke="#a78bfa" stroke-width="2.6" stroke-linecap="round" opacity=".9">
    <path d="M161 157 h21"/>
    <path d="M161 165 h15"/>
  </g>
  <path d="M170 180 l5 5 10 -11" fill="none" stroke="#67e8f9"
        stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- wordmark -->
  <text x="128" y="216" text-anchor="middle"
        font-family="Inter, 'DejaVu Sans', sans-serif"
        font-size="30" font-weight="700" letter-spacing="5"
        fill="#e9eaf0">JMP</text>
  <text x="128" y="232" text-anchor="middle"
        font-family="Inter, 'DejaVu Sans', sans-serif"
        font-size="8.4" letter-spacing="2.1" fill="#8f97a6">JULAIN MUSIC PLAYER</text>
</svg>
